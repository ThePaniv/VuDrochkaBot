[project]
name = "vudrochka-bot"
version = "1.0.0"
description = "Discord bot that renames a voice channel's status to an otter-count in Ukrainian and greets joiners with neural TTS."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Andrii Pankiv" }]
keywords = ["discord", "discord-bot", "voice", "tts", "ukrainian"]

dependencies = [
    "discord-py[voice]>=2.7.1,<3",
    "edge-tts>=7.2.8,<8",
    "pydantic-settings>=2.14.2,<3",
]

[project.scripts]
vudrochka-bot = "vudrochka_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vudrochka_bot"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["vudrochka_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
